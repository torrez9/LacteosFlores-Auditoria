name:  SAST - CodeQL / DevSkim / Gitleaks / Composer Audit

on:
  push:
    branches: [ "auditoria", "main" ]
  pull_request:
    branches: [ "auditoria", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name:  CodeQL (Análisis de Código)
    runs-on: ubuntu-latest
    steps:
      - name:  Clonar repositorio
        uses: actions/checkout@v4

      - name:  Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name:  Instalar dependencias Composer
        run: composer install --no-interaction --prefer-dist

      - name:  Ejecutar CodeQL
        uses: github/codeql-action/analyze@v3

  devskim:
    name:  DevSkim (Análisis de Código Inseguro)
    runs-on: ubuntu-latest
    needs: codeql
    steps:
      - uses: actions/checkout@v4
      - name:  Instalar .NET SDK
        uses: actions/setup-dotnet@v3
      - name:  Instalar DevSkim CLI
        run: dotnet tool install --global Microsoft.CST.DevSkim.CLI
      - name:  Ejecutar DevSkim
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p audit/reports
          devskim analyze -I app -O audit/reports/devskim-results.sarif -f sarif || true
      - name:  Subir reporte DevSkim
        uses: actions/upload-artifact@v4
        with:
          name: devskim-report
          path: audit/reports/devskim-results.sarif

  gitleaks:
    name:  Gitleaks (Detección de secretos)
    runs-on: ubuntu-latest
    needs: [codeql]
    steps:
      - uses: actions/checkout@v4
      - name:  Ejecutar Gitleaks
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . --report-path audit/reports/gitleaks.json
      - name:  Subir reporte Gitleaks
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: audit/reports/gitleaks.json

  composer-audit:
    name:  Auditoría de dependencias PHP
    runs-on: ubuntu-latest
    needs: [codeql]
    steps:
      - uses: actions/checkout@v4
      - name:  Instalar dependencias
        run: composer install --no-interaction --prefer-dist
      - name:  Ejecutar composer audit
        run: |
          mkdir -p audit/reports
          composer audit --format=json > audit/reports/composer-audit.json || true
      - name:  Subir reporte Composer Audit
        uses: actions/upload-artifact@v4
        with:
          name: composer-audit-report
          path: audit/reports/composer-audit.json
