name: "ci(security): SAST - DevSkim, Gitleaks, Composer Audit"

on:
  push:
    branches: [ auditoria ]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias Composer
        run: |
          sudo apt-get update
          sudo apt-get install -y composer
          composer install --no-interaction --no-progress

      - name: Analizar código con DevSkim
        uses: microsoft/DevSkim-Action@v1
        with:
          directory-to-scan: .
          output-filename: audit/reports/devskim-results.sarif

      - name: Detectar secretos con Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auditoría de dependencias PHP
        run: |
          mkdir -p audit/reports
          composer audit --format=json > audit/reports/composer-audit.json || true
