name: "ci(security): DAST - OWASP ZAP + SQLMap"

on:
  push:
    branches: [ auditoria ]

jobs:
  dast:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y php php-cli php-mbstring php-xml sqlmap
          php -S 127.0.0.1:8080 -t . &
          sleep 10

      - name: OWASP ZAP Full Scan
        run: |
          mkdir -p audit/reports
          wget https://github.com/zaproxy/zaproxy/releases/download/v2.15.0/ZAP_2_15_0_unix.sh -O zap.sh
          chmod +x zap.sh
          ./zap.sh -cmd -quickurl http://127.0.0.1:8080 -quickprogress -quickout audit/reports/zap-report.html || true

      - name: SQLMap (Pruebas de inyección SQL)
        run: |
          sqlmap -u "http://127.0.0.1:8080" --batch --crawl=1 --output-dir=audit/reports/sqlmap/ || true

      - name: Subir reportes generados
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: audit/reports
